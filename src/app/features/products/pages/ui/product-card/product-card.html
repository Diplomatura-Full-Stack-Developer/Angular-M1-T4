<mat-card
  class="example-card justify-between items-center h-full bg-primary-100/80! shadow-lg! border-none!"
  appearance="outlined"
>
  <mat-card-header class="text-center my-2">
    @if (error(); as errorMessage) {
      <div class="text-accent-600 text-center text-2xl font-bold">{{ errorMessage }}</div>
    }
    <mat-card-title class="text-lg font-bold text-shadow-sm text-primary-600">{{
      product.category
    }}</mat-card-title>
    <mat-card-subtitle class="text-sm text-secondary-500! font-bold text-shadow-sm">{{
      product.brand
    }}</mat-card-subtitle>
  </mat-card-header>
  <img
    mat-card-md-image
    [src]="product.imageUrl"
    alt="Photo of a Shiba Inu"
    class="w-full h-full object-contain"
  />
  <mat-card-content class="text-sm text-gray-700 text-shadow-sm my-2">
    <p>Precio: {{ product.price | currency: '$ ' }}</p>

    @if (product.discount > 0) {
      <p class="text-accent-600 font-bold">
        Precio con descuento: {{ product.price | discount: product.discount | currency: '$ ' }}
      </p>
    }
  </mat-card-content>
  <mat-card-actions>
    <button matButton [routerLink]="['/product', product.id]">Ver producto</button>
    <button matButton class="bg-accent-600 text-white" (click)="deleteProductById(product.id)">
      Eliminar
    </button>
  </mat-card-actions>
</mat-card>
