<nav class="flex justify-end items-center gap-2 hidden md:block">
  <ul class="flex flex-row gap-4 text-sm font-bold">
    <li class="hover:text-primary-500 transition-colors duration-300">
      <a [routerLink]="['']">Inicio</a>
    </li>
    @if (session()) {
      <li class="hover:text-primary-500 transition-colors duration-300">
        <a class="cursor-pointer" (click)="logout()">Cerrar sesión</a>
      </li>
    } @else {
      <li class="hover:text-primary-500 transition-colors duration-300">
        <a [routerLink]="['/login']">Iniciar sesión</a>
      </li>
    }
  </ul>
</nav>
<nav class="flex justify-end items-center gap-2 block md:hidden">
  <button matIconButton [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
    <mat-icon>dehaze</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    <button mat-menu-item [routerLink]="['']">
      <mat-icon>home</mat-icon>
      <span>Inicio</span>
    </button>
    @if (session()) {
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Cerrar sesión</span>
      </button>
    } @else {
      <button mat-menu-item [routerLink]="['/login']">
        <mat-icon>login</mat-icon>
        <span>Iniciar sesión</span>
      </button>
    }
  </mat-menu>
</nav>
